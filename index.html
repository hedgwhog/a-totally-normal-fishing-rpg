<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-rpg</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="container">
            <div id="dayPopupHidden"></div>

            <div id="dayContainer">Day 1</div>
            <div id="time">Morning</div>
            
            <div id="inventory">
                <h3>Inventory</h3>
                <div id="inventoryItem"></div>
            </div>

        <div class="dock-container">
            <div class="list">
                <button id="nextDay">Sleeping</button>
                <button id="nextFish">Fishing</button>
            </div>
            <h1 class="center">The docks</h1>
            <div class="center" id="coinAmount">Coins: 0</div>
            <div class="center" id="fishAmount">You got 0 fish</div>

            <div class="event-container">
                <button id="sellFish">Sell fish to the Fishmonger<br>4 fish = 1 coin</button>
                <button id="marketplace" onclick="marketplaceDisplay.style.display = 'block'">Marketplace</button>
            </div>

            <div id="marketplaceDisplay">
                <h1>Marketplace</h1>
                <h4>Marketplace opens once every 5 days, for a 2 day period.</h4>
                <button class="marketplaceDisplay-close" onclick="marketplaceDisplay.style.display = 'none'">Close marketplace</button>
                <div id="marketplaceItem"></div>
            </div>
        </div>
    </div>
    <script type="module" src="js/events.js"></script>
    <script type="module" src="js/user.js"></script>
    <script type="module" src="js/time.js"></script>
</body>
</html>
