<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        .contain {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            line-height: 0.4;
        }
        .border {
            border: 5px dotted black;
            padding: 30px;
        }
    </style>
</head>
<body>
    <div class="contain">
        <div class="border">
            <h1>Welcome to:</h1>
            <h2>A totally normal fishing rpg (trust)</h2>
            <p>Please click here to launch the game:</p>
            <button onclick="launchGame()">Launch game</button>
            <h5>WARNING: By pressing to launch the game, you will open a new window.<br><br><br><br>I will kindly ask you not the resize the window, since it isn't designed for that.</h5>
        </div>
    </div>
    <script>
        function launchGame() {
            const width = 750;
            const height = 510;
            
            window.open(
                "introduction.html", 
                "TextRPG", 
                `width=${width},height=${height},top=0,left=0,menubar=no,toolbar=no,location=no,status=no,resizable=no`
            );
        }
    </script>
</body>
</html>
